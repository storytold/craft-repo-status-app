# Craft Status — ~/.craft_status_config.toml
# The app re-reads this file before every poll; changes apply without a restart
# (window/tray/shortcut changes apply on the next poll or relaunch).

# Repositories to watch: "owner/name" or full GitHub URLs.
repos = [
  "storytold/photocraft",
  "storytold/lightcraft",
  "storytold/filmcraft",
  "storytold/designcraft",
  "storytold/vectorcraft",
  "storytold/pdfcraft",
  "storytold/effectcraft",
  "storytold/wordcraft",
  "storytold/deckcraft",
  "storytold/gridcraft",
  "storytold/cadcraft",
  "storytold/soundcraft",
  "storytold/craft-libs",
  "storytold/craft-launcher",
  "storytold/figcraft",
]

# How old a repo's data gets before it's refetched (minutes, at least 1).
# Repos are fetched one at a time, missing data first, then the stalest, 20 s
# apart; each costs roughly 6 GraphQL requests + 1 REST request.
poll_minutes = 30.0

# Data older than this is flagged STALE in the window (never less than poll_minutes).
stale_minutes = 60.0

# Used only if $CRAFT_STATUS_GITHUB_TOKEN, $GITHUB_TOKEN and $GH_TOKEN are all
# unset; leave empty to fall back to `gh auth token`. Never commit a real token:
# this file lives in your home directory, not in the repository.
github_token = ""

[window]
width = 1340.0
height = 560.0
always_on_top = false
start_hidden = false
opacity = 0.96

[tray]
hide_dock_icon = true            # macOS: menu-bar-only app (restart to apply)
visible_on_all_workspaces = true # summon onto the current desktop/space
close_to_tray = true

[shortcuts]
toggle_window = "CmdOrCtrl+Shift+G"   # "" disables

[people]
# The team roster for the People tab: the https:// URL of a sheet's CSV
# export, or a CSV file path. The app reads it while running and keeps a
# downloaded copy in its cache for an hour. Leave empty for none.
roster = ""
# GitHub logins of the owners, who decide pull requests held for the owner,
# in every repo that [people.repo_owners] does not list.
owner_logins = []
# Logins that count as maintainers of every repo, besides the ones found from
# membership, merges and closes.
maintainers = []
# Repos whose maintainers rebase contributors' branches themselves. In these
# repos a conflict on a contributor's pull request that maintainers can push
# to shows as a flag, and the People tab does not count it as the author's
# work.
rebase_repos = ["storytold/vectorcraft", "storytold/figcraft"]
# Repos whose maintainers land contributors' work through a batch branch, so
# a landed pull request may close without merging. The People tab's rankings
# mark their merge and landed counts as unverified.
batch_repos = ["storytold/designcraft", "storytold/deckcraft"]

# Owners of one repo, in place of owner_logins:
# [people.repo_owners]
# "owner/name" = ["owner-login"]
