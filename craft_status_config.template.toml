# Craft Status — ~/.craft_status_config.toml
# The app re-reads this file before every poll; changes apply without a restart
# (window/tray/shortcut changes apply on the next poll or relaunch).

# Repositories to watch: "owner/name" or full GitHub URLs. The Type column comes
# from the app's own list of these repos; any other repo you add shows as "—".
repos = [
  # Apps
  "storytold/photocraft",
  "storytold/lightcraft",
  "storytold/filmcraft",
  "storytold/designcraft",
  "storytold/vectorcraft",
  "storytold/pdfcraft",
  "storytold/effectcraft",
  "storytold/wordcraft",
  "storytold/deckcraft",
  "storytold/gridcraft",
  "storytold/cadcraft",
  "storytold/soundcraft",
  "storytold/figcraft",
  "storytold/craft-launcher",
  "storytold/craft-anything",
  "tangency-labs/solidcraft",  # third party
  # Libraries
  "storytold/craft-libs",
  "storytold/craft-i18n",
  "storytold/craft-ai-integrations",
  "storytold/indd-utils",
  # Assets and test data
  "storytold/craft-fonts",
  "storytold/photocraft-corpus",
  "storytold/craft-launcher-assets",
  # CI
  "storytold/craft-common-actions",
  # Tooling
  "storytold/craft-contrib",
  "storytold/craft-skills",
]

# How old a repo's data gets before it's refetched (minutes, at least 1).
# Repos are fetched one at a time, missing data first, then the stalest, 20 s
# apart; each costs roughly 6 GraphQL requests + 1 REST request.
poll_minutes = 30.0

# Data older than this is flagged STALE in the window (never less than poll_minutes).
stale_minutes = 60.0

# Used only if $CRAFT_STATUS_GITHUB_TOKEN, $GITHUB_TOKEN and $GH_TOKEN are all
# unset; leave empty to fall back to `gh auth token`. Never commit a real token:
# this file lives in your home directory, not in the repository.
github_token = ""

[window]
width = 1340.0
height = 560.0
always_on_top = false
start_hidden = false
opacity = 0.96

[tray]
hide_dock_icon = true            # macOS: menu-bar-only app (restart to apply)
visible_on_all_workspaces = true # summon onto the current desktop/space
close_to_tray = true

[shortcuts]
toggle_window = "CmdOrCtrl+Shift+G"   # "" disables

# ───── The PR tab ─────
# Every setting here is optional. The PR tab covers the repos above, less third
# parties and exclude_repos.
[pr_review]
# Repos owned by anyone else are third party (solidcraft): they stay on the
# Downloads and Fix first tabs, but their PRs aren't fetched or reviewed.
first_party_owners = ["storytold"]
# First-party repos to leave out of the PR tab, as "owner/name".
exclude_repos = []

# How often each repo's open-PR list is brought up to date (minutes).
poll_minutes = 30.0
# How often the whole list is rewalked (hours). Only this picks up CI and
# merge-conflict changes on PRs nobody touched: GitHub doesn't count those as updates.
full_list_hours = 4.0
# Data older than this is flagged STALE (minutes; never less than poll_minutes).
stale_minutes = 90.0

# GitHub's GraphQL budget is 5000 points an hour for the account. Inspecting PRs
# and walking merge history stop at this many points an hour; keeping the lists
# current does not.
max_points_per_hour = 2500
# All PR fetching pauses below this many points left, well above the 150 where the
# Downloads tab's polling pauses, so PR review always gives way first.
budget_floor = 1000

# Authors with more than this many PRs landed across the craft apps are "frequent".
frequent_over = 30
# Quality score (0-100) that counts as "high quality".
high_quality = 75
# Whether a contributors/people.toml entry makes someone core, as well as write
# access. Contributors may add their own entry, so turn this off for a stricter list.
people_toml_is_core = true
# Paths that deserve a closer look when someone without write access changes them.
sensitive_paths = [
  ".github/workflows/", ".github/actions/", ".github/CODEOWNERS", "CODEOWNERS",
  "build.rs", ".cargo/config", "deny.toml", ".coderabbit.yaml",
  "sonar-project.properties", "Dockerfile", "tauri.conf.json", "/capabilities/",
]

[pr_review.claude]
# Claude runs through the Claude Code CLI, using its login. No tools, no MCP.
enabled = true
# Path to the claude binary; empty looks in the usual install locations.
binary = ""
model = "claude-opus-5-5"
effort = "low"
# PRs summarized per call.
batch_size = 12
# Hard limits on background calls. Asking for one PR by hand counts toward the
# dollar limit too, but isn't refused by it.
max_runs_per_hour = 12
max_usd_per_day = 5.0
# How often each repo's overlapping PRs are regrouped (hours).
group_refresh_hours = 24.0
