name: Publish Web Version

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Refresh stats every 15 minutes to keep status current
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run UI tests and type check
        run: |
          npm test
          npm run typecheck

      - name: Build UI assets
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run crate tests
        run: cargo test --locked -p craft-core -p craft-github

      - name: Build release binaries
        run: cargo build --release --locked -p craft-github --bin craft-fetch

      - name: Fetch snapshot
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.CRAFT_STATUS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/craft-fetch --snapshot ui/dev-snapshot.json

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp ui/index.html ui/style.css _site/
          if [ -f ui/dev-snapshot.json ]; then
            cp ui/dev-snapshot.json _site/
          else
            echo "{}" > _site/dev-snapshot.json
          fi
          cp -R ui/build _site/build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload GitHub Actions build artifact
        uses: actions/upload-artifact@v7
        with:
          name: craft-status-web
          path: _site
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
