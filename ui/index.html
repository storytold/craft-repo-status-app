<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V9M6 14V6M10 14V4M14 14V1"/></svg>
        <span data-tauri-drag-region>Craft Status</span>
      </div>
      <nav class="views" role="tablist" aria-label="Tabs">
        <button class="view" data-view="repos" role="tab" title="Downloads (⌘1)">Downloads <span class="badge" id="repo-count"></span></button>
        <button class="view" data-view="prs" role="tab" title="PRs (⌘2)">PRs <span class="badge good" id="prs-count"></span></button>
        <button class="view" data-view="urgent" role="tab" title="Fix first (⌘3)">Fix first <span class="badge hot" id="urgent-count"></span></button>
        <button class="view" data-view="parity" role="tab" title="Parity (⌘4)">Parity <span class="badge hot" id="parity-count"></span></button>
      </nav>
      <fieldset class="kinds" id="repo-kinds" aria-label="Which repos to show"></fieldset>
      <nav class="views sub" id="pr-nav" aria-label="PR views" hidden>
        <button class="view" data-pr-view="apps">Repos <span class="badge" id="apps-count"></span></button>
        <button class="view" data-pr-view="queue">Review queue <span class="badge good" id="queue-count"></span></button>
      </nav>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" hidden></nav>
      <div class="status" data-tauri-drag-region>
        <span id="fresh-pill" class="pill"></span>
        <span id="pr-pill" class="pill" hidden></span>
        <span id="refreshed" class="refreshed" data-tauri-drag-region></span>
      </div>
      <div class="actions">
        <button class="icon-button" id="refresh" title="Refresh now (⌘R)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg>
        </button>
        <button class="icon-button" id="pin" title="Always on top">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg>
        </button>
        <button class="icon-button" id="hide" title="Hide (Esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="banner" id="pr-banner" hidden></div>

    <main id="repos-view">
      <table id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </main>

    <main id="prs-view" hidden></main>

    <main id="parity-view" hidden>
      <div class="parity-bar">
        <div class="segmented" role="tablist" aria-label="Parity view">
          <button class="seg" data-pview="apps" role="tab">Apps</button>
          <button class="seg" data-pview="gaps" role="tab">All gaps</button>
        </div>
        <div class="parity-filters" id="parity-filters"></div>
      </div>
      <div class="parity-body">
        <div class="parity-main" id="parity-main"></div>
        <aside class="parity-detail" id="parity-detail" aria-label="App detail" hidden></aside>
      </div>
    </main>

    <main id="urgent-view" hidden>
      <div class="urgent-controls">
        <select id="urgent-repo" aria-label="Repository"></select>
        <label class="toggle"><input type="checkbox" id="critical-only"> Critical only</label>
        <span class="hint">Scored by severity words, labels, user reports, 👍/💬, the latest build and freshness. Click to open on GitHub.</span>
      </div>
      <ol class="urgent-list" id="urgent-list"></ol>
    </main>

    <footer data-tauri-drag-region>
      <span class="foot-group" id="status-foot" data-tauri-drag-region>
        <span id="next" data-tauri-drag-region></span>
        <span id="budget" data-tauri-drag-region></span>
        <span id="token" data-tauri-drag-region></span>
      </span>
      <span class="foot-group" id="pr-foot" data-tauri-drag-region hidden>
        <span id="activity" data-tauri-drag-region></span>
        <span id="backlog" data-tauri-drag-region></span>
        <span id="pr-budget" data-tauri-drag-region></span>
        <span id="claude" data-tauri-drag-region></span>
      </span>
      <span class="spacer" data-tauri-drag-region></span>
      <button class="footer-link" id="edit-config">Edit config</button>
      <span id="shortcut"></span>
    </footer>
    <div id="resize" title="Resize"></div>
  </div>
  <!-- Compiled from ui/src/ by `npm run build` (run by the app's build.rs). -->
  <script type="module" src="build/report.js"></script>
  <script type="module" src="build/main.js"></script>
</body>
</html>
