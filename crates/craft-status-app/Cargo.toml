[package]
name = "craft-status-app"
description = "Tray dashboard for the storytold *craft repositories"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "craft_status_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
craft-core = { path = "../craft-core" }
craft-github = { path = "../craft-github" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
